services:

  frontend:
    image: httpd:2.4
    container_name: frontend
    restart: unless-stopped
    ports:
      - "85:80"
    volumes:
      - ./src/frontend:/usr/local/apache2/htdocs:ro
    depends_on:
      - backend
    networks:
      - iot_network

  backend:
    build:
      context: ./src/backend
    container_name: backend
    restart: unless-stopped
    ports:
      - "81:81"
    volumes:
      - ../mqtt_broker/certs/ca.crt:/app/certs/ca.crt:ro
      - ./certs/backend.crt:/app/certs/backend.crt:ro
      - ${BACKEND_KEY_PATH}:/app/certs/backend.key:ro
    networks:
      - iot_network
      - iot_mqtt

networks:
  iot_network:
    driver: bridge

  # Created by mqtt_broker/docker-compose.yml, which must be up first.
  iot_mqtt:
    external: true