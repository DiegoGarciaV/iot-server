services:
  mysql-test-server:
    image: mysql:8.2.0
    container_name: mysql-test-server
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: test_password
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
      MYSQL_DATABASE: test_db
    networks:
      - smart_locker_network


  mqtt_broker:
    build:
      context: ./src/mqtt_broker

    container_name: mqtt_broker
    restart: unless-stopped

    ports:
      - "8883:8883"

    volumes:
      - ./certs/broker.crt:/mosquitto/certs/broker.crt:ro
      - ./certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ${BROKER_KEY_PATH}:/mosquitto/certs/broker.key:ro
    networks:
      - smart_locker_network

networks:
  smart_locker_network:
    driver: bridge