[project]
name = "smart-locker-backend"
version = "0.1.0"
description = "Backend orchestator for Smart Locker services"
requires-python = ">=3.12"

dependencies = [
    "paho-mqtt>=2.1.0",
    "websockets>=15.0.1",
    "mysql-connector-python",
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smart_locker"]

[tool.uv]
package = true